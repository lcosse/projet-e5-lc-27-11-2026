apiVersion: apps/v1
kind: Deployment
metadata:
  name: stock-deployment-lc-27-11-2026
  namespace: e5-lc-27-11-2026
  labels:
    app: stock-lc-27-11-2026
spec:
  replicas: 3
  selector:
    matchLabels:
      app: stock-lc-27-11-2026
  template:
    metadata:
      labels:
        app: stock-lc-27-11-2026
    spec:
      containers:
        - name: stock-app
          image: stock-lc-27-11-2026:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5006
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /health
              port: 5006
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 5006
            initialDelaySeconds: 10
            periodSeconds: 15
