apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: gateway-admin-lc-27-11-2026
  namespace: e5-lc-27-11-2026
spec:
  gatewayClassName: eg
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: route-admin-lc-27-11-2026
  namespace: e5-lc-27-11-2026
spec:
  parentRefs:
    - name: gateway-admin-lc-27-11-2026
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /admin
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /stock
      backendRefs:
        - name: stock-service-lc-27-11-2026
          port: 5006
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: route-last-lc-27-11-2026
  namespace: e5-lc-27-11-2026
spec:
  parentRefs:
    - name: gateway-admin-lc-27-11-2026
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /last
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /orders
      backendRefs:
        - name: orders-service-lc-27-11-2026
          port: 5007
